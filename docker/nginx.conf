# Nginx de soporte-app: sirve public/ y pasa lo demás a PHP-FPM. Escucha en el
# 80 sin TLS: el HTTPS lo pone Caddy delante.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;

    # Igual que post_max_size: un cierre de visita con fotos pesa decenas de MB.
    client_max_body_size 32m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # El manifiesto de la app de campo no está en los tipos de Nginx.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # El service worker nunca se guarda en caché: si se quedara viejo, el
    # navegador no vería las correcciones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Los archivos de Vite llevan la huella en el nombre: caché de un año.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Nada de .env, .git ni similares, aunque alguno llegara a public/.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }
}
