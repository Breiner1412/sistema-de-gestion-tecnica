; PHP de la imagen de producción.

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 256M
max_execution_time = 60

; Un cierre de visita viaja en un solo JSON con hasta seis fotos y la firma
; en base64 (unos 26 MB en el peor caso). Nginx acepta lo mismo.
post_max_size = 32M
upload_max_filesize = 32M

date.timezone = America/Bogota

; El código no cambia dentro del contenedor: no se revisan las fechas.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
