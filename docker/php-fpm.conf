; Pool de PHP-FPM. Nginx habla con él dentro del mismo contenedor.
[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Sin esto PHP-FPM borra las variables de entorno y Laravel no ve el .env que
; Docker le pasa al contenedor.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
